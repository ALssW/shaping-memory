<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Shaping Memory">
  <defs>
    <!-- 深底与 --color-background(#1c1c1e) 同源，顶边略亮一档做出玻璃的厚度 -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2c" />
      <stop offset="1" stop-color="#1c1c1e" />
    </linearGradient>
  </defs>

  <!-- 底板：圆角恒为边长的 1/3，与页头 .brand__dot 是同一条比例语言 -->
  <rect width="64" height="64" rx="15" fill="url(#plate)" />

  <!-- 叠影：上一次显影留下的那一帧，向右上走半个格 —— 「塑形」的过程感 -->
  <rect x="26" y="16" width="22" height="22" rx="7.3" fill="#e8a33c" fill-opacity="0.26" />

  <!-- 光晕：页头品牌点那颗 18% accent 外环的同一件事，让实体从深底里浮起来 -->
  <rect x="17" y="17" width="30" height="30" rx="10" fill="#e8a33c" fill-opacity="0.18" />

  <!-- 本体：accent 实心圆角方块，#e8a33c 即 --color-accent -->
  <rect x="21" y="21" width="22" height="22" rx="7.3" fill="#e8a33c" />
</svg>