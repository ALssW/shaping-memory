<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-label="单点 AF 对焦框">
  <title>光标 · 正常（单点 AF）</title>
  <!--
    母版栅格 viewBox 0 0 128 128，几何中心 (64,64) 即热点。
    CSS 实际挂载尺寸是 32×32，缩放比恰好 0.25 —— 4 单位 = 1px，
    因此下面所有坐标都取 4 的倍数，边线正好落在整数像素上，零半像素模糊。

    【本轮尺寸：整体缩到原设计的 50%】
      可视包络 = 底衬外沿 44..84 → 11..21px，共 10px（原 24..104 → 20px）✓ 恰好一半
      面层方框 = 48..80 → 12..20px，边长 8px（原 18px）
      面层线宽 = 4 单位 = 1px（原 8 单位 = 2px）✓ 恰好一半
      底衬露出 = 4 单位 = 1px（原样保留，刻意不跟着缩水）

    为什么底衬不缩到 0.5px：它是「白框压在纯白照片上仍留得住轮廓」的唯一保险，
    而且 0.5px 落在半像素上必然发虚。包络已经精确减半，把这一圈留在 1px
    是「清晰度 > 绝对比例」的取舍，见 docs/光标图标规范.md §3.2。

    双层结构（不用 stroke）：
      底层 = 更粗的一圈深色实心矩形，向面层内外各露出 4 单位（1px）
      面层 = 白色方框，外 48..80、内 52..76，线宽 4 单位（1px）
  -->
  <!-- 深色底衬（外 44..84、内孔 56..72） -->
  <path d="M44 44H84V84H44Z M56 56H72V72H56Z" fill="#18181A" fill-rule="evenodd"/>
  <!-- 白色方框 -->
  <path d="M48 48H80V80H48Z M52 52H76V76H52Z" fill="#F5F5F7" fill-rule="evenodd"/>
</svg>
