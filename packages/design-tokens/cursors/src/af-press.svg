<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-label="微点 AF 对焦框">
  <title>光标 · 按下（微点 AF）</title>
  <!--
    悬停态的绿框 + 中心一枚更小的绿框，读起来就是「焦点收窄、正在落点」。

    【尺寸：外框与 af-hover 完全一致（整体为原设计的 50%）】
      外框面层 = 48..80 → 12..20px，线宽 4 单位 = 1px
      内框面层 = 56..72 → 14..18px，线宽 4 单位 = 1px，孔 60..68（2px）
      内 : 外 = 4px : 8px = 1 : 2

    关于比例由 1:3 变成 1:2：
      原设计外框 18px 时，1:3 的内框是 6px，落在整数像素上；
      现在外框缩到 8px，1:3 要求内框 2.67px —— 既落不到整数像素，
      也没有 1px 的线宽可用（线宽变虚，微点即糊成一片）。
      于是取「能被 1px 线宽整除且能围出可见孔」的最大内框 4px，
      代价是比例变成 1:2。层级关系（外框主、内框次）不受影响。

    内框为什么不再单独画底衬：
      底衬的内孔正好是 56..72，与外框内框的外沿完全重合 ——
      也就是说内框天生就被一圈 1px 的深色包着，再补一层纯属重复。
      少画一层，内框边缘反而更干净。
  -->
  <!-- 外框底衬（内孔 56..72，同时充当内框的衬底） -->
  <path d="M44 44H84V84H44Z M56 56H72V72H56Z" fill="#18181A" fill-rule="evenodd"/>
  <!-- 外框（绿） -->
  <path d="M48 48H80V80H48Z M52 52H76V76H52Z" fill="#30D158" fill-rule="evenodd"/>
  <!-- 内框（绿，外 56..72、孔 60..68） -->
  <path d="M56 56H72V72H56Z M60 60H68V68H60Z" fill="#30D158" fill-rule="evenodd"/>
</svg>
