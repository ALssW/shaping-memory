<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-label="动态区域 AF 对焦框">
  <title>光标 · 拖拽（动态区域 AF）</title>
  <!--
    悬停态绿框 + 周围一圈小点，对应相机的「动态区域 AF」：
    主对焦点之外还挂着一圈副对焦点，表示「可动的范围」。

    【点的排布：正方形 4 角 + 4 边中点】
    正方形周长因此被 8 等分，相邻两点间距天然全等 —— 这是正方形上唯一间距均匀的分法。
    不用 12 枚：12 枚落在正方形边上会出现「角密边疏」。

    【点与方框的距离】
    点环半边长 36 单位（9px），绿芯内缘距面层方框外沿 16 单位 = 4px。
    初版是 9 单位 = 2.25px，间隙增大到 1.78 倍；若从用户实际感知的底衬外沿算，
    则是 1.25px → 3px。方框缩到 8px 后若点还贴着，整枚光标会糊成一片噪点。

    【点必须带深色底衬（本轮修正）】
    早先的点是纯绿实心圆、零衬底 —— 逻辑是「衬底每边占 1px 会占用 2px 的点」。
    但该逻辑有误：底衬是**向外扩**的，绿色芯径保持不变。
    没有衬底的实际后果是：绿点落在浅色照片、绿色调照片或中灰背景上时直接消失，
    而主框因为有一圈深色衬底在任何背景上都立得住 —— 两者不一致。
    现在点与主框同构：r=8 深色圆（4px 直径）垫底，r=4 绿圆（2px 直径）叠在上面，
    自然露出一圈 1px 的深色环。绿芯仍是 2px，只是外面包了 halo。

    【为什么点用圆而主框用矩形】
    圆无法与像素网格对齐（任意半径的圆边都落在像素内部），因此点的边缘天生带抗锯齿。
    这是圆形的物理属性，不是缺陷：2px 的芯 + 1px 的环在 32px 挂载下读起来仍然干净。
    主框是矩形，承担「零模糊」的锚点，所以构建脚本的像素对齐自检只跑 af-normal。

    动画说明：原生 cursor 只渲染一张静态位图，无法做动效，
    因此拖拽反馈靠「一圈点」这个静态图形表达，不引入 JS 跟随元素。
  -->
  <!-- 主框底衬（内孔 56..72） -->
  <path d="M44 44H84V84H44Z M56 56H72V72H56Z" fill="#18181A" fill-rule="evenodd"/>
  <!-- 主框（绿） -->
  <path d="M48 48H80V80H48Z M52 52H76V76H52Z" fill="#30D158" fill-rule="evenodd"/>
  <!-- 环绕点的底衬：r=8（4px 直径），比绿芯向外多露 4 单位 = 1px -->
  <g fill="#18181A">
    <circle cx="28" cy="28" r="8"/>
    <circle cx="64" cy="28" r="8"/>
    <circle cx="100" cy="28" r="8"/>
    <circle cx="100" cy="64" r="8"/>
    <circle cx="100" cy="100" r="8"/>
    <circle cx="64" cy="100" r="8"/>
    <circle cx="28" cy="100" r="8"/>
    <circle cx="28" cy="64" r="8"/>
  </g>
  <!-- 环绕点的绿芯：r=4（2px 直径），正方形 4 角 + 4 边中点 -->
  <g fill="#30D158">
    <circle cx="28" cy="28" r="4"/>
    <circle cx="64" cy="28" r="4"/>
    <circle cx="100" cy="28" r="4"/>
    <circle cx="100" cy="64" r="4"/>
    <circle cx="100" cy="100" r="4"/>
    <circle cx="64" cy="100" r="4"/>
    <circle cx="28" cy="100" r="4"/>
    <circle cx="28" cy="64" r="4"/>
  </g>
</svg>
